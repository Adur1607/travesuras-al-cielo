<div class="cobertura-wrapper">
    <div class="cobertura-layout">
        
        <!-- Lado Izquierdo: Información y Formulario -->
        <div class="cobertura-content">
            <h2>Verifica nuestra cobertura</h2>
            <p class="subtitle">Brindamos atención inmediata y traslado sin costos adicionales en Lima Metropolitana y Lima Sur.</p>
            
            <div class="coverage-card">
                <form [formGroup]="coberturaForm" (ngSubmit)="verificar(selectDistrito.options[selectDistrito.selectedIndex].text)">
                    <label class="coverage-label">Selecciona tu distrito:</label>
                    <div class="input-group">
                        <select #selectDistrito formControlName="distrito" class="coverage-select">
                            <option value="">-- Elige un distrito --</option>
                            <!-- Lima Sur / Zonas principales -->
                            <option value="cobertura-completa">Villa El Salvador</option>
                            <option value="cobertura-completa">Santiago de Surco</option>
                            <option value="cobertura-completa">Chorrillos</option>
                            <option value="cobertura-completa">Miraflores</option>
                            <option value="cobertura-completa">San Borja</option>
                            <option value="cobertura-completa">San Juan de Miraflores</option>
                            <option value="cobertura-completa">Villa María del Triunfo</option>
                            <option value="cobertura-completa">La Molina</option>
                            <option value="cobertura-completa">San Isidro</option>
                            <option value="cobertura-completa">Lince / Jesús María</option>
                            <!-- Zonas especiales -->
                            <option value="cobertura-especial">Otros Distritos (Lima Norte / Este)</option>
                        </select>
                        <button type="submit" class="btn-mocha-coverage">Verificar</button>
                    </div>
                    
                    @if (resultado) {
                        <div class="coverage-result" [class.success]="resultado.tipo === 'success'" [class.warning]="resultado.tipo === 'warning'" [class.error]="resultado.tipo === 'error'">
                            {{ resultado.mensaje }}
                        </div>
                    }
                </form>
            </div>
        </div>

        <!-- Lado Derecho: Mapa Estilizado en Tonos Tierra -->
        <div class="cobertura-map-side">
            <div class="map-marker">
                <div class="pulse"></div>
            </div>
            <div class="map-label">Atención 24/7 en Lima</div>
        </div>

    </div>
</div>
